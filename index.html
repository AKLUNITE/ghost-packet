<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GHOST//PACKET</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Share+Tech+Mono&family=Klee+One:wght@600&family=Zen+Old+Mincho:wght@700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl" aria-label="3Dゲーム盤"></canvas>
<div class="hud" id="hud" hidden>
  <div class="topl"><div class="logo">GHOST<b>//</b>PACKET</div><span class="code" id="hudCode"></span></div>
  <div class="banner glass" id="banner"><div class="ph" id="ph"></div><div class="sub" id="phSub"></div></div>
  <div class="topr">
    <button class="tb pcOnly ic" id="bGuard" aria-pressed="false" title="出目ガード：自分の出目を、押している間（Spaceキー）だけ表示"><svg viewBox="0 0 24 24"><path d="M6 20l2-14h8l2 14z"/><path d="M9 6c0-2 6-2 6 0"/></svg><span>ガード</span></button>
    <button class="tb pcOnly ic" id="bLogT" aria-pressed="true" title="通信ログの表示／非表示"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span>ログ</span></button>
    <button class="tb pcOnly ic" id="bSettings" title="設定（音量・振動・演出）"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>設定</span></button>
    <button class="tb pcOnly ic" id="bRules" title="ルール"><svg viewBox="0 0 24 24"><path d="M4 5c3-1 5-1 8 1 3-2 5-2 8-1v14c-3-1-5-1-8 1-3-2-5-2-8-1z"/><path d="M12 6v14"/></svg><span>ルール</span></button>
    <button class="tb pcOnly ic" id="bLeave" title="退出"><svg viewBox="0 0 24 24"><path d="M10 4H5v16h5"/><path d="M14 8l4 4-4 4M18 12H9"/></svg><span>退出</span></button>
    <button class="tb cpOnly" id="bMenu" aria-label="メニュー">☰ メニュー</button>
  </div>
  <div class="rail" id="rail"></div>
  <div class="side"><div class="glass rack" id="rack"></div><div class="glass log" id="log"></div></div>
  <div class="dock glass" id="dock"></div>
</div>
<div id="bubbles"></div>
<div id="splash"></div>
<div id="duelBox" class="duelBox" hidden></div>
<div id="screen" class="screen"></div>
<div id="modal" hidden></div>
<div id="sheetBack" class="sheetBack" hidden></div>
<div id="reconn" class="reconn" hidden><span class="spin"></span>接続が切れました。再接続中…</div>
<div id="sheet" class="sheet" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="engine.js"></script>
<script src="bots.js"></script>
<script src="room.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
